name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch or PR makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, build and package lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # publint checks the package.json exports and files; attw checks the types resolve.
      - run: npm run check:package

  test:
    name: Test (Node ${{ matrix.node }}, Nest ${{ matrix.nest }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        nest: [10, 11, 12]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # The lockfile pins Nest 12. Swap in the other majors without touching package.json.
      - name: Install Nest ${{ matrix.nest }}
        if: matrix.nest != 12
        run: >
          npm install --no-save --no-audit --no-fund
          @nestjs/common@${{ matrix.nest }}
          @nestjs/core@${{ matrix.nest }}
          @nestjs/testing@${{ matrix.nest }}
      - run: npm test

  # The matrix above runs on PGlite. This job covers what PGlite cannot: the real connection pool,
  # LISTEN/NOTIFY and transactional workers.
  postgres:
    name: Integration (Postgres 17)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PG_TEST_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run test/postgres.spec.ts

  # One stable name to require in branch protection, whatever the matrix looks like.
  ci:
    name: CI passed
    if: always()
    needs: [verify, test, postgres]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
